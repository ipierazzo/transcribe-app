<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Transcrição e Análise com IA</title>
    <!-- TailwindCSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-8">
    <div class="container mx-auto px-4 max-w-6xl">
        <h1 class="text-4xl font-bold text-center mb-8 text-gray-800">
            Sistema de Transcrição e Análise com IA
        </h1>

        <!-- Controles -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <!-- Seletor de Método de Transcrição -->
            <div class="mb-4 flex justify-center gap-4 items-center">
                <label class="text-gray-700 font-semibold">Método de Transcrição:</label>
                <select id="metodoTranscricao" class="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="webspeech">Web Speech API (Tempo Real)</option>
                    <option value="whisper">Whisper AI (Alta Precisão)</option>
                </select>
                <span class="text-xs text-gray-500">Whisper oferece melhor precisão para termos médicos</span>
            </div>
            
            <div class="flex justify-center gap-4">
                <button 
                    id="btnIniciar" 
                    class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg transition duration-200 disabled:bg-gray-400 disabled:cursor-not-allowed"
                >
                    🎤 Iniciar Gravação
                </button>
                <button 
                    id="btnParar" 
                    class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-lg transition duration-200 disabled:bg-gray-400 disabled:cursor-not-allowed"
                    disabled
                >
                    ⏹️ Parar e Analisar
                </button>
                <button 
                    id="btnLimpar" 
                    class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded-lg transition duration-200"
                >
                    🗑️ Limpar
                </button>
            </div>
            
            <!-- Status -->
            <div id="status" class="mt-4 text-center text-gray-600">
                <span id="statusTexto">Pronto para iniciar</span>
            </div>
        </div>

        <!-- Área de Transcrição -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <h2 class="text-2xl font-semibold mb-4 text-gray-700">Transcrição em Tempo Real</h2>
            <div 
                id="transcricao" 
                class="bg-gray-50 border-2 border-gray-300 rounded-lg p-4 min-h-[300px] max-h-[400px] overflow-y-auto text-gray-800 whitespace-pre-wrap"
            >
                <p class="text-gray-400 italic">A transcrição aparecerá aqui...</p>
            </div>
            <div class="mt-2 text-sm text-gray-500">
                Caracteres: <span id="contador">0</span>
            </div>
        </div>

        <!-- Área de Resultado da IA -->
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-2xl font-semibold mb-4 text-gray-700">Análise da IA</h2>
            <div 
                id="resultado" 
                class="bg-blue-50 border-2 border-blue-300 rounded-lg p-4 min-h-[200px] text-gray-800 whitespace-pre-wrap"
            >
                <p class="text-gray-400 italic">A análise aparecerá aqui após clicar em "Parar e Analisar"...</p>
            </div>
        </div>
    </div>

    <script>
        // Variáveis globais
        let recognition = null;
        let websocket = null;
        let isRecording = false;
        let clientId = null;
        let transcriptionText = "";
        let mediaRecorder = null;
        let audioChunks = [];
        let audioStream = null;
        
        // Dicionário de termos médicos comuns para melhorar reconhecimento
        const termosMedicos = {
            'tireoide': ['tireoide', 'tiroide', 'tireóide'],
            'hipotireoidismo': ['hipotireoidismo', 'hipotiroidismo'],
            'hipertireoidismo': ['hipertireoidismo', 'hipertiroidismo'],
            'glicemia': ['glicemia', 'glicose'],
            'diabetes': ['diabetes', 'diabete'],
            'insulina': ['insulina', 'insulino'],
            'metabolismo': ['metabolismo', 'metabólico'],
            'hormônio': ['hormônio', 'hormonio', 'hormonal'],
            'endocrinologia': ['endocrinologia', 'endócrino'],
            'obesidade': ['obesidade', 'obeso'],
            'colesterol': ['colesterol', 'colesterol'],
            'triglicerídeos': ['triglicerídeos', 'triglicerideos'],
            'hemoglobina': ['hemoglobina', 'hemoglobina glicada'],
            'hba1c': ['hba1c', 'hemoglobina glicada', 'hba1c'],
            'tsh': ['tsh', 'hormônio tireoestimulante'],
            't4': ['t4', 'tiroxina'],
            't3': ['t3', 'triiodotironina']
        };
        
        // Função para corrigir termos médicos comuns
        function corrigirTermosMedicos(texto) {
            let textoCorrigido = texto;
            for (const [termoCorreto, variacoes] of Object.entries(termosMedicos)) {
                for (const variacao of variacoes) {
                    const regex = new RegExp(`\\b${variacao}\\b`, 'gi');
                    textoCorrigido = textoCorrigido.replace(regex, termoCorreto);
                }
            }
            return textoCorrigido;
        }
        
        // #region agent log
        const LOG_ENDPOINT = 'http://127.0.0.1:7242/ingest/e32b9f29-9aec-4b65-a399-bae00a10c41e';
        function logDebug(sessionId, runId, hypothesisId, location, message, data) {
            fetch(LOG_ENDPOINT, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    sessionId: sessionId,
                    runId: runId,
                    hypothesisId: hypothesisId,
                    location: location,
                    message: message,
                    data: data,
                    timestamp: Date.now()
                })
            }).catch(() => {});
        }
        // #endregion

        // Gera ID único para o cliente
        function generateClientId() {
            return 'client_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        // Inicializa Web Speech API
        function initSpeechRecognition() {
            // Verifica suporte
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Seu navegador não suporta Web Speech API. Use Chrome, Edge ou Safari.');
                return null;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();

            // Configurações otimizadas para melhor precisão
            recognition.continuous = true;  // Continua ouvindo
            recognition.interimResults = true;  // Mostra resultados intermediários
            recognition.lang = 'pt-BR';  // Idioma português brasileiro
            
            // Configurações adicionais para melhor precisão
            if ('maxAlternatives' in recognition) {
                recognition.maxAlternatives = 3;  // Considera até 3 alternativas
            }
            
            // Melhora a detecção de pontuação e pausas
            if ('serviceURI' in recognition) {
                // Usa serviço do Google se disponível
            }

            // Event handlers
            recognition.onstart = () => {
                console.log('Reconhecimento de voz iniciado');
                updateStatus('🎤 Gravando...', 'text-green-600');
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                // Processa resultados
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }

                // Atualiza transcrição na tela
                if (finalTranscript) {
                    // Corrige termos médicos antes de adicionar
                    const textoCorrigido = corrigirTermosMedicos(finalTranscript);
                    
                    // #region agent log
                    logDebug('debug-session', 'run1', 'B', 'index.html:125', 'Final transcript received', {finalTranscriptLength: finalTranscript.length, beforeLength: transcriptionText.length, websocketReady: websocket && websocket.readyState === WebSocket.OPEN});
                    // #endregion
                    transcriptionText += textoCorrigido + ' ';
                    updateTranscriptionDisplay();
                    
                    // Envia para backend via WebSocket
                    if (websocket && websocket.readyState === WebSocket.OPEN) {
                        const message = {type: 'texto', texto: textoCorrigido.trim()};
                        // #region agent log
                        logDebug('debug-session', 'run1', 'B', 'index.html:133', 'Sending text fragment to backend', {clientId: clientId, textoLength: message.texto.length, textoPreview: message.texto.substring(0, 50)});
                        // #endregion
                        websocket.send(JSON.stringify(message));
                    } else {
                        // #region agent log
                        logDebug('debug-session', 'run1', 'A', 'index.html:137', 'WebSocket not ready for text send', {clientId: clientId, readyState: websocket ? websocket.readyState : 'null'});
                        // #endregion
                    }
                } else {
                    // Mostra resultado intermediário (também corrigido)
                    const interimCorrigido = corrigirTermosMedicos(interimTranscript);
                    updateTranscriptionDisplay(interimCorrigido);
                }
            };

            recognition.onerror = (event) => {
                console.error('Erro no reconhecimento:', event.error);
                
                if (event.error === 'no-speech') {
                    // Silenciosamente reinicia se não houver fala
                    if (isRecording) {
                        setTimeout(() => {
                            if (isRecording && recognition) {
                                try {
                                    recognition.start();
                                } catch (e) {
                                    console.log('Tentativa de reiniciar reconhecimento...');
                                }
                            }
                        }, 1000);
                    }
                } else if (event.error === 'network') {
                    updateStatus('❌ Erro de rede. Tentando reconectar...', 'text-red-600');
                    // Tenta reconectar
                    if (isRecording) {
                        setTimeout(() => {
                            if (isRecording) {
                                initSpeechRecognition();
                                recognition.start();
                            }
                        }, 2000);
                    }
                } else {
                    updateStatus(`❌ Erro: ${event.error}`, 'text-red-600');
                }
            };

            recognition.onend = () => {
                console.log('Reconhecimento de voz finalizado');
                
                // Se ainda estiver gravando, reinicia automaticamente
                if (isRecording) {
                    updateStatus('🔄 Reiniciando reconhecimento...', 'text-yellow-600');
                    setTimeout(() => {
                        if (isRecording && recognition) {
                            try {
                                recognition.start();
                            } catch (e) {
                                console.log('Erro ao reiniciar:', e);
                                // Tenta criar nova instância
                                if (isRecording) {
                                    initSpeechRecognition();
                                    recognition.start();
                                }
                            }
                        }
                    }, 500);
                } else {
                    updateStatus('Parado', 'text-gray-600');
                }
            };

            return recognition;
        }

        // Verifica se o servidor está disponível
        async function verificarServidor() {
            // Tenta múltiplos endpoints
            const endpoints = ['/health', '/api/health', '/'];
            
            for (const endpoint of endpoints) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 2000);
                    
                    const response = await fetch(endpoint, { 
                        method: 'GET',
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    
                    if (response.ok || response.status === 200) {
                        console.log(`✅ Servidor está online (endpoint: ${endpoint})`);
                        return true;
                    }
                } catch (error) {
                    if (error.name !== 'AbortError') {
                        console.log(`   Tentativa com ${endpoint} falhou:`, error.message);
                    }
                    // Continua tentando outros endpoints
                }
            }
            
            console.error('❌ Nenhum endpoint respondeu');
            return false;
        }
        
        // Conecta WebSocket
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 5;
        
        async function connectWebSocket() {
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                console.log('WebSocket já está conectado');
                return;
            }
            
            // Verifica se o servidor está online antes de tentar conectar
            const servidorOnline = await verificarServidor();
            if (!servidorOnline) {
                console.warn('Servidor não está respondendo, pulando conexão WebSocket');
                updateStatus('⚠️ Servidor não está respondendo. Execute: python main.py no terminal', 'text-yellow-600');
                // Não retorna, permite que continue sem WebSocket (modo offline)
                console.log('Continuando em modo offline (sem WebSocket)');
            }
            
            clientId = generateClientId();
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/${clientId}`;
            console.log(`Tentando conectar WebSocket: ${wsUrl}`);
            // #region agent log
            logDebug('debug-session', 'run1', 'A', 'index.html:201', 'WebSocket connection attempt', {clientId: clientId, wsUrl: wsUrl});
            // #endregion
            
            websocket = new WebSocket(wsUrl);

            websocket.onopen = () => {
                console.log('✅ WebSocket conectado com sucesso');
                reconnectAttempts = 0; // Reset contador de tentativas
                // #region agent log
                logDebug('debug-session', 'run1', 'A', 'index.html:208', 'WebSocket opened', {clientId: clientId, readyState: websocket.readyState});
                // #endregion
                updateStatus('✅ Conectado e gravando', 'text-green-600');
            };

            websocket.onmessage = (event) => {
                // #region agent log
                logDebug('debug-session', 'run1', 'A', 'index.html:214', 'WebSocket message received', {clientId: clientId, dataLength: event.data.length, dataPreview: event.data.substring(0, 100)});
                // #endregion
                let data;
                try {
                    data = JSON.parse(event.data);
                } catch (e) {
                    // #region agent log
                    logDebug('debug-session', 'run1', 'D', 'index.html:220', 'JSON parse error in WebSocket message', {clientId: clientId, error: e.message, data: event.data.substring(0, 200)});
                    // #endregion
                    return;
                }
                // #region agent log
                logDebug('debug-session', 'run1', 'D', 'index.html:225', 'WebSocket message parsed', {clientId: clientId, messageType: data.type});
                // #endregion
                
                if (data.type === 'analise_completa') {
                    // #region agent log
                    logDebug('debug-session', 'run1', 'C', 'index.html:229', 'Analysis complete received', {clientId: clientId, resultadoLength: data.resultado ? data.resultado.length : 0});
                    // #endregion
                    // Mostra resultado da análise na área de resultado
                    const resultadoEl = document.getElementById('resultado');
                    if (data.resultado && data.resultado.trim()) {
                        resultadoEl.textContent = data.resultado;
                        resultadoEl.classList.remove('text-gray-400', 'italic');
                        resultadoEl.classList.add('text-gray-800');
                    } else {
                        resultadoEl.innerHTML = '<p class="text-gray-400 italic">Nenhuma análise retornada.</p>';
                    }
                    updateStatus('✅ Análise concluída!', 'text-green-600');
                    document.getElementById('btnParar').disabled = false;
                } else if (data.type === 'erro') {
                    // #region agent log
                    logDebug('debug-session', 'run1', 'A', 'index.html:235', 'Error message received', {clientId: clientId, mensagem: data.mensagem});
                    // #endregion
                    updateStatus(`❌ ${data.mensagem}`, 'text-red-600');
                    alert('Erro: ' + data.mensagem);
                } else if (data.type === 'confirmacao') {
                    // #region agent log
                    logDebug('debug-session', 'run1', 'B', 'index.html:240', 'Confirmation received', {clientId: clientId, status: data.status});
                    // #endregion
                    console.log('Confirmação recebida:', data.status);
                }
            };

            websocket.onerror = (error) => {
                console.error('❌ Erro no WebSocket:', error);
                console.error('   URL tentada:', wsUrl);
                // #region agent log
                logDebug('debug-session', 'run1', 'A', 'index.html:245', 'WebSocket error', {clientId: clientId, error: error.toString(), wsUrl: wsUrl});
                // #endregion
                updateStatus('❌ Erro na conexão WebSocket. Verifique se o servidor está rodando.', 'text-red-600');
            };

            websocket.onclose = (event) => {
                console.log('🔌 WebSocket desconectado', {
                    code: event.code,
                    reason: event.reason,
                    wasClean: event.wasClean
                });
                // #region agent log
                logDebug('debug-session', 'run1', 'A', 'index.html:252', 'WebSocket closed', {
                    clientId: clientId, 
                    isRecording: isRecording, 
                    readyState: websocket.readyState,
                    closeCode: event.code,
                    closeReason: event.reason
                });
                // #endregion
                
                if (isRecording) {
                    reconnectAttempts++;
                    if (reconnectAttempts <= MAX_RECONNECT_ATTEMPTS) {
                        updateStatus(`⚠️ Conexão perdida. Tentando reconectar... (${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`, 'text-yellow-600');
                        // Tenta reconectar após 2 segundos
                        setTimeout(() => {
                            if (isRecording) {
                                connectWebSocket();
                            }
                        }, 2000);
                    } else {
                        updateStatus('❌ Falha ao reconectar. Verifique se o servidor está rodando.', 'text-red-600');
                        console.error('Máximo de tentativas de reconexão atingido');
                    }
                }
            };
        }

        // Atualiza display da transcrição
        function updateTranscriptionDisplay(interim = '') {
            const display = document.getElementById('transcricao');
            const fullText = transcriptionText + (interim ? ' ' + interim : '');
            display.textContent = fullText || 'A transcrição aparecerá aqui...';
            
            // Atualiza contador
            document.getElementById('contador').textContent = fullText.length;
            
            // Auto-scroll para o final
            display.scrollTop = display.scrollHeight;
        }

        // Atualiza status
        function updateStatus(texto, classe = 'text-gray-600') {
            const statusEl = document.getElementById('statusTexto');
            statusEl.textContent = texto;
            statusEl.className = classe;
        }

        // Inicia gravação de áudio para Whisper
        async function iniciarGravacaoAudio() {
            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        channelCount: 1,
                        sampleRate: 16000,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    } 
                });
                
                const options = { mimeType: 'audio/webm' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options.mimeType = 'audio/webm;codecs=opus';
                }
                
                mediaRecorder = new MediaRecorder(audioStream, options);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await enviarAudioParaWhisper(audioBlob);
                };
                
                mediaRecorder.start(1000); // Coleta dados a cada 1 segundo
                console.log('Gravação de áudio iniciada para Whisper');
            } catch (error) {
                console.error('Erro ao iniciar gravação:', error);
                alert('Erro ao acessar microfone. Verifique as permissões.');
            }
        }
        
        // Envia áudio para processamento com Whisper
        async function enviarAudioParaWhisper(audioBlob) {
            try {
                updateStatus('🔄 Processando áudio com Whisper...', 'text-yellow-600');
                
                const formData = new FormData();
                formData.append('audio', audioBlob, 'audio.webm');
                
                const response = await fetch('/api/transcribe-whisper', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error('Erro ao processar áudio');
                }
                
                const data = await response.json();
                
                if (data.transcription) {
                    transcriptionText = data.transcription;
                    updateTranscriptionDisplay();
                    updateStatus('✅ Transcrição concluída com Whisper', 'text-green-600');
                } else {
                    throw new Error('Nenhuma transcrição retornada');
                }
            } catch (error) {
                console.error('Erro ao processar com Whisper:', error);
                updateStatus('❌ Erro ao processar com Whisper', 'text-red-600');
                alert('Erro ao processar áudio: ' + error.message);
            }
        }
        
        // Para gravação de áudio
        function pararGravacaoAudio() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
                audioStream = null;
            }
        }
        
        // Botão Iniciar
        document.getElementById('btnIniciar').addEventListener('click', async () => {
            if (!isRecording) {
                isRecording = true;
                transcriptionText = '';
                updateTranscriptionDisplay();
                
                const metodo = document.getElementById('metodoTranscricao').value;
                
                if (metodo === 'webspeech') {
                    // Usa Web Speech API
                    recognition = initSpeechRecognition();
                    if (recognition) {
                        recognition.start();
                    }
                    // Tenta conectar WebSocket, mas continua funcionando mesmo se falhar
                    try {
                        connectWebSocket();
                    } catch (e) {
                        console.warn('WebSocket não disponível, usando modo offline:', e);
                        updateStatus('⚠️ Modo offline - transcrição local apenas', 'text-yellow-600');
                    }
                } else if (metodo === 'whisper') {
                    // Usa Whisper (gravação de áudio)
                    await iniciarGravacaoAudio();
                    updateStatus('🎤 Gravando áudio para Whisper...', 'text-green-600');
                }
                
                // Atualiza UI
                document.getElementById('btnIniciar').disabled = true;
                document.getElementById('btnParar').disabled = false;
                document.getElementById('resultado').textContent = 'Processando...';
            }
        });

        // Botão Parar
        document.getElementById('btnParar').addEventListener('click', async () => {
            if (isRecording) {
                // #region agent log
                logDebug('debug-session', 'run1', 'B', 'index.html:293', 'Stop button clicked', {clientId: clientId, transcriptionLength: transcriptionText.length, websocketReady: websocket && websocket.readyState === WebSocket.OPEN});
                // #endregion
                isRecording = false;
                
                const metodo = document.getElementById('metodoTranscricao').value;
                
                if (metodo === 'webspeech') {
                    // Para reconhecimento Web Speech
                    if (recognition) {
                        recognition.stop();
                        recognition = null;
                    }
                    
                    // Tenta usar WebSocket, se não funcionar, usa API HTTP
                    if (websocket && websocket.readyState === WebSocket.OPEN) {
                        // #region agent log
                        logDebug('debug-session', 'run1', 'B', 'index.html:304', 'Sending fim command', {clientId: clientId});
                        // #endregion
                        websocket.send(JSON.stringify({ type: 'fim' }));
                        updateStatus('⏳ Processando análise com IA...', 'text-yellow-600');
                        document.getElementById('btnParar').disabled = true;
                    } else {
                        // Fallback: usa API HTTP se WebSocket não estiver disponível
                        console.log('WebSocket não disponível, usando API HTTP para análise');
                        if (transcriptionText.trim()) {
                            await processarComIA();
                        } else {
                            alert('Nenhuma transcrição disponível para análise.');
                        }
                    }
                } else if (metodo === 'whisper') {
                    // Para gravação de áudio e processa
                    pararGravacaoAudio();
                    
                    // Se já temos transcrição, envia para análise
                    if (transcriptionText.trim()) {
                        await processarComIA();
                    }
                }
                
                // Atualiza UI
                document.getElementById('btnIniciar').disabled = false;
            }
        });
        
        // Processa transcrição com IA (para Whisper)
        async function processarComIA() {
            try {
                updateStatus('⏳ Processando análise com IA...', 'text-yellow-600');
                document.getElementById('btnParar').disabled = true;
                
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ transcription: transcriptionText })
                });
                
                if (!response.ok) {
                    throw new Error('Erro ao processar análise');
                }
                
                const data = await response.json();
                
                if (data.resultado) {
                    const resultadoEl = document.getElementById('resultado');
                    resultadoEl.textContent = data.resultado;
                    resultadoEl.classList.remove('text-gray-400', 'italic');
                    resultadoEl.classList.add('text-gray-800');
                    updateStatus('✅ Análise concluída!', 'text-green-600');
                }
            } catch (error) {
                console.error('Erro ao processar com IA:', error);
                updateStatus('❌ Erro ao processar análise', 'text-red-600');
                alert('Erro ao processar análise: ' + error.message);
            } finally {
                document.getElementById('btnParar').disabled = false;
            }
        }

        // Botão Limpar
        document.getElementById('btnLimpar').addEventListener('click', () => {
            // Limpa transcrição
            transcriptionText = '';
            updateTranscriptionDisplay();
            document.getElementById('contador').textContent = '0';
            
            // Limpa análise
            const resultadoEl = document.getElementById('resultado');
            resultadoEl.innerHTML = '<p class="text-gray-400 italic">A análise aparecerá aqui após clicar em "Parar e Analisar"...</p>';
            resultadoEl.classList.remove('text-gray-800');
            resultadoEl.classList.add('text-gray-400', 'italic');
            
            // Limpa status
            updateStatus('Pronto para iniciar', 'text-gray-600');
            
            // Limpa no backend também
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.send(JSON.stringify({ type: 'limpar' }));
            }
        });

        // Limpa recursos ao fechar página
        window.addEventListener('beforeunload', () => {
            if (recognition) {
                recognition.stop();
            }
            if (websocket) {
                websocket.close();
            }
        });
    </script>
</body>
</html>
